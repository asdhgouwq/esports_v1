<script>
/* ============================================================
   RIFT.GG — 앱 로직
   ============================================================ */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const T = c => TEAMS[c] || {code:c,name:c,color:"#888"};
const badge = (c,size="") =>
  `<span class="badge ${size}" style="background:${T(c).color}">${esc(c)}</span>`;

const DOW = ["일","월","화","수","목","금","토"];
const fmtDate = d => {
  const [y,m,dd] = d.split("-").map(Number);
  const dt = new Date(Date.UTC(y,m-1,dd));
  return `${m}월 ${dd}일 (${DOW[dt.getUTCDay()]})`;
};
const TODAY = "2026-07-28";
const dayName = d => d===TODAY ? `오늘 · ${fmtDate(d)}` : fmtDate(d);

let state = { view:"home", team:null, report:"m201", set:-1, schedLeague:"ALL", schedTab:"upcoming" };

/* ============================================================
   ROUTER
   ============================================================ */
function go(view, arg, set){
  state.view = view;
  if(view==="team")  state.team = arg;
  if(view==="ai" && arg){
    if(arg!==state.report) state.set = -1;      /* 다른 매치로 이동하면 시리즈 종합부터 */
    state.report = arg;
    if(set!==undefined) state.set = set;
  }
  render();
  window.scrollTo({top:0,behavior:"instant"});
}
function goSet(i){ state.set = i; render(); window.scrollTo({top:0,behavior:"instant"}); }
function render(){
  $$(".view").forEach(v=>v.classList.remove("is-active"));
  const navKey = state.view==="team" ? "teams" : state.view;
  $$("#nav button").forEach(b=>b.toggleAttribute("aria-current", b.dataset.view===navKey));
  $$("#nav button").forEach(b=>{ if(b.dataset.view===navKey) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  const host = $("#view-"+state.view);
  host.classList.add("is-active");
  ({home:renderHome,schedule:renderSchedule,standings:renderStandings,
    teams:renderTeams,team:renderTeam,ai:renderAI})[state.view](host);
}

/* ============================================================
   SHARED PARTS
   ============================================================ */
function matchRow(m,{compact=false}={}){
  const done = m.status==="done", live = m.status==="live";
  const aWin = done && m.sa>m.sb, bWin = done && m.sb>m.sa;
  const scoreA = m.sa===null ? "" : m.sa, scoreB = m.sb===null ? "" : m.sb;
  const time = live
    ? `<b style="color:#ff5757">LIVE</b><span style="font-size:11px">${esc(m.liveNote||"")}</span>`
    : `<b>${esc(m.time)}</b>${compact?"":`<span>${esc(m.league)}</span>`}`;
  const hasReport = !!REPORTS[m.id];
  const action = hasReport
    ? `<button class="btn-ai" onclick="go('ai','${m.id}')">✦ AI 리포트</button>`
    : (live ? `<span class="tag tag-live"><i class="dot-live"></i>실시간</span>`
            : `<span class="tag">${esc(m.stage)}</span>`);
  return `<article class="match">
    <div class="match-time">${time}</div>
    <div class="match-teams">
      <div class="mt-row ${bWin?'lose':''}">${badge(m.a)}<span class="mt-name">${esc(T(m.a).name)}</span><span class="mt-score num">${scoreA}</span></div>
      <div class="mt-row ${aWin?'lose':''}">${badge(m.b)}<span class="mt-name">${esc(T(m.b).name)}</span><span class="mt-score num">${scoreB}</span></div>
    </div>
    <div class="match-actions">${action}</div>
  </article>`;
}

function groupByDate(list){
  const map = new Map();
  list.forEach(m=>{ if(!map.has(m.date)) map.set(m.date,[]); map.get(m.date).push(m); });
  return [...map.entries()];
}

/* ============================================================
   HOME
   ============================================================ */

        <div class="card-body">${recent.map(m=>matchRow(m,{compact:true})).join("")}</div>
      </section>
    </div>

    <div class="grid" style="gap:16px">
      <section class="card">
        <div class="card-head"><h3 class="card-title">LCK 레전드 그룹</h3>
          <button class="card-link" onclick="go('standings')">순위표 →</button></div>
        <div class="card-body" style="padding:8px 12px 12px">
          <table><tbody>
          ${STANDINGS.legend.rows.map((r,i)=>`<tr style="cursor:pointer" onclick="go('team','${r.t}')">
            <td class="rank ${i<3?'q':''}" style="padding-left:4px">${i+1}</td>
            <td><div class="team-cell">${badge(r.t,'sm')}<span style="font-size:12.5px">${esc(T(r.t).name)}</span></div></td>
            <td class="t-right num" style="font-weight:700;padding-right:4px">${r.w}-${r.l}</td>
          </tr>`).join("")}
          </tbody></table>
        </div>
      </section>

      <section class="card">
        <div class="card-head"><h3 class="card-title">소식</h3></div>
        <div class="card-body" style="padding:6px 16px 12px">
          ${NEWS.map(n=>`<div class="news-item"><span class="news-dot"></span>
            <div><div class="news-h">${esc(n.h)}</div><div class="news-m">${esc(n.m)}</div></div></div>`).join("")}
        </div>
      </section>
    </div>
  </div>`;
}

/* ============================================================
   SCHEDULE
   ============================================================ */
function renderSchedule(host){
  const leagues = ["ALL","LCK","LPL","LEC"];
  const tabs = [["upcoming","예정"],["done","결과"]];
  const list = MATCHES
    .filter(m=> state.schedLeague==="ALL" || m.league===state.schedLeague)
    .filter(m=> state.schedTab==="upcoming" ? m.status!=="done" : m.status==="done")
    .sort((a,b)=> state.schedTab==="upcoming"
        ? (a.date+a.time).localeCompare(b.date+b.time)
        : (b.date+b.time).localeCompare(a.date+a.time));

  host.innerHTML = `
  <div class="page-head">
    <div><h1 class="page-title">일정 · 결과</h1>
      <p class="page-sub">리그별 경기 일정과 종료된 경기의 AI 리포트</p></div>

  <div class="chip-row" style="margin-bottom:8px">
    ${leagues.map(l=>`<button class="chip" aria-pressed="${state.schedLeague===l}" onclick="state.schedLeague='${l}';render()">${l==="ALL"?"전체":l}</button>`).join("")}
  </div>
  ${groupByDate(list).map(([d,ms])=>`
    <div class="day-label">${dayName(d)}</div>

  </div>

  <div class="grid cols-2">

        ${roster.map(([pos,nick,real,kda])=>`<div class="roster-row">

  <div class="page-head">

      <div class="ai-side"><div style="text-align:right">
        <div class="nm" style="${winA?'color:var(--ink-3)':''}">${esc(T(m.b).name)}</div>
        <div class="sub">${winA?"패":"승"}</div></div>${badge(m.b,'lg')}</div>
      <div style="margin-left:auto;text-align:right">
        <div class="tag">${esc(m.league)} · ${esc(m.stage)}</div>

    <p style="color:var(--ink-2);font-size:13.5px;line-height:1.75;margin:14px 0 0">${S.summary}</p>
    <div class="ai-meta">
      ${S.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join("")}

        <div class="conf-track"><div class="conf-fill" style="width:${S.confidence}%"></div></div>
        <span class="num">${S.confidence}%</span></div>
    </div>
  </div>

  <div class="set-bar">
    <button class="set-tab" aria-pressed="${gi===-1}" onclick="goSet(-1)">
      <span class="st-n">시리즈 종합</span><span class="st-w">${games.length}세트 전체</span></button>
    ${games.map((g,i)=>`<button class="set-tab" aria-pressed="${gi===i}" onclick="goSet(${i})">

      <span class="st-w">${badge(g.winner,'sm')} 승 · ${esc(g.duration)}</span></button>`).join("")}
  </div>`;

  host.innerHTML = head + (gi===-1 ? seriesView(R,m) : gameView(games[gi],R,m));

}

/* ---------- 시리즈 종합 ---------- */
function seriesView(R,m){
  const S=R.series, games=R.games;
  const maxAbs = Math.max(...games.map(g=>Math.abs(g.gold[g.gold.length-1][1]))) || 1;
  return `
  <div class="grid cols-main" style="margin-top:16px">
    <section class="card">
      <div class="card-head"><div>
        <h3 class="card-title">세트별 요약</h3>
        <div class="page-sub" style="margin-top:1px">막대는 각 세트 종료 시점의 골드 격차</div></div></div>
      <div class="card-body" style="padding:4px 16px">
        <div class="chart-legend" style="margin:12px 0 0">
          <span><i style="background:var(--series-1)"></i>${esc(T(m.a).name)} 우세</span>
          <span><i style="background:var(--series-2)"></i>${esc(T(m.b).name)} 우세</span>
        </div>
        ${games.map((g,i)=>{
          const v = g.gold[g.gold.length-1][1];
          const w = Math.abs(v)/maxAbs*46;
          const pos = v>=0;
          const txt = (pos?"+":"-") + (Math.abs(v)/1000).toFixed(1) + "k";
          return `<div class="set-row">
            <div class="set-no">${g.set}세트<small>${esc(g.duration)}</small></div>
            <div><div class="set-hl">${g.headline}</div>
              <div class="set-meta">${badge(g.winner,'sm')}
                <span class="tag">승 ${esc(T(g.winner).name)}</span>
                ${g.tags.slice(0,2).map(t=>`<span class="tag">#${esc(t)}</span>`).join("")}</div></div>
            <div class="gdbar"><div class="zero"></div>
              <div class="fill" style="${pos?`left:50%`:`left:${50-w}%`};width:${w}%;
                   background:${pos?'var(--series-1)':'var(--series-2)'}"></div>
              ${w>=20
                /* 막대가 충분히 길면 안쪽 끝에, 짧으면 바깥에 — 잘림 방지 */
                ? `<div class="lbl in" style="${pos?`left:50%`:`left:${50-w}%`};width:${w}%;
                     text-align:${pos?'right':'left'};padding:0 6px">${txt}</div>`
                : `<div class="lbl" style="${pos?`left:${51+w}%`:`right:${51+w}%`}">${txt}</div>`}</div>
            <button class="btn-ai" onclick="goSet(${i})">세트 리포트 →</button>
          </div>`;}).join("")}
      </div>
    </section>

    <div class="grid" style="gap:16px">
      <section class="card">
        <div class="card-head"><h3 class="card-title">시리즈 총평</h3>
          <span class="card-link">MVP ${esc(S.mvp)}</span></div>
        <div class="card-body">
          <p style="font-size:13.5px;line-height:1.8;color:var(--ink-2);margin:0">${S.takeaway}</p>
        </div>
      </section>
      <section class="card">
        <div class="card-head"><h3 class="card-title">분석 정보</h3></div>
        <div class="card-body" style="font-size:12.5px;color:var(--ink-2);line-height:1.9">
          <div style="display:flex;justify-content:space-between"><span class="muted">모델</span><b>${esc(S.model)}</b></div>
          <div style="display:flex;justify-content:space-between"><span class="muted">생성 시각</span><b class="num">${esc(S.generated)}</b></div>
          <div style="display:flex;justify-content:space-between"><span class="muted">분석 단위</span><b>세트(게임) 단위 ${R.games.length}건</b></div>
          <div style="display:flex;justify-content:space-between"><span class="muted">시리즈 신뢰도</span><b class="num">${S.confidence}%</b></div>
        </div>
      </section>
      <div class="disclaimer"><span>ⓘ</span>
        <div>시리즈 총평은 <b style="color:var(--ink-2)">세트별 리포트를 합산해 생성</b>됩니다. 세트마다 밴픽·조합·양상이 달라지므로, 구체적인 근거는 각 세트 리포트에서 확인하세요.</div>
      </div>
    </div>

}

/* ============================================================
   DRAFT BOARD — 방송식 밴픽 순서표
   ============================================================ */
/* 프로 드래프트 순서: 1차 밴 6 → 1차 픽 6 → 2차 밴 4 → 2차 픽 4 */
const DRAFT_ORDER = [
  ["ban","B",0],["ban","R",0],["ban","B",1],["ban","R",1],["ban","B",2],["ban","R",2],
  ["pick","B",0],["pick","R",0],["pick","R",1],["pick","B",1],["pick","B",2],["pick","R",2],
  ["ban","R",3],["ban","B",3],["ban","R",4],["ban","B",4],
  ["pick","R",3],["pick","B",3],["pick","B",4],["pick","R",4]
];
const PHASES = [["1차 밴",6,"ban"],["1차 픽",6,"pick"],["2차 밴",4,"ban"],["2차 픽",4,"pick"]];

const champHue = n => { let h=0; for(const c of n) h=(h*31+c.charCodeAt(0))%360; return h; };
const champBg  = n => { const h=champHue(n);
  return `linear-gradient(150deg,hsl(${h} 44% 44%),hsl(${(h+34)%360} 48% 22%))`; };
const champAbbr = n => n.replace(/[\s0-9]/g,"").slice(0,2);

/* 타일 + 이름 (요약·우선밴 영역용 소형 카드) */
function miniTile(champ,opts={}){
  return `<div class="mini">${tile(champ,opts)}
    <div class="slot-nm ${opts.ban?'':'on'}">${esc(champ)}</div></div>`;
}
function tile(champ,{ban=false,ord=null,pos=null,key=false}={}){
  return `<div class="tile ${ban?'ban':''} ${key?'key':''}" style="background:${champBg(champ)}"
     title="${esc(champ)}${ban?' (밴)':pos?' · '+pos:''}">
    ${ord?`<span class="ord">${ord}</span>`:""}
    <span>${esc(champAbbr(champ))}</span>
    ${pos?`<span class="pos">${pos}</span>`:""}
  </div>`;
}

function draftSection(G,m){
  const bp = G.banpick;
  if(!bp) return "";
  const blueKey = bp.blue || "a";
  const redKey  = blueKey==="a" ? "b" : "a";
  const blueCode = m[blueKey], redCode = m[redKey];
  const side = {B:bp[blueKey], R:bp[redKey]};

  /* 각 진영 행의 20칸을 만든다 — 자기 차례가 아닌 칸은 빈 칸 */
  const cells = {B:[], R:[]};
  DRAFT_ORDER.forEach(([kind,s,i],n)=>{
    const other = s==="B" ? "R" : "B";
    const champ = kind==="ban" ? side[s].bans[i] : side[s].picks[i][0];
    const pos   = kind==="ban" ? null : side[s].picks[i][1];
    cells[s].push(`<div class="slot">
      ${tile(champ,{ban:kind==="ban",ord:n+1,pos,key:champ===bp.key})}
      <div class="slot-nm ${kind==="pick"?"on":""}">${esc(champ)}</div></div>`);
    cells[other].push(`<div class="slot"><div class="tile-empty"></div><div class="slot-nm"></div></div>`);
  });

  const firstBans = [side.B.bans[0], side.R.bans[0], side.B.bans[1], side.R.bans[1]];

  const sideRow = (s,code,tag) => `<div class="dside">${badge(code)}
      <span class="dnm">${esc(T(code).name)}</span>
      <span class="dside-tag ${tag}">${tag==='b'?'청':'홍'}</span></div>${cells[s].join("")}`;

  return `
  <section class="card" style="margin-top:16px">
    <div class="card-head">
      <div><h3 class="card-title">밴픽 분석 — 드래프트 순서표</h3>
        <div class="page-sub" style="margin-top:1px">왼쪽에서 오른쪽으로 진행 · 숫자는 밴픽 순서 · 화면이 좁으면 좌우로 스크롤</div></div>
      <span class="tag">${G.set}세트</span>
    </div>
    <div class="card-body">
      <div class="draft-legend">
        <span><b>빗금 + 어두운 타일</b> = 밴</span>
        <span><b>밝은 타일</b> = 픽 (하단에 라인 표기)</span>
        <span><b>①~⑳</b> = 진행 순서</span>
        <span><b>흰 테두리</b> = AI가 짚은 핵심 카드</span>
      </div>
      <div class="draft-scroll"><div class="draft">
        <div></div>
        ${PHASES.map(([label,span,kind])=>
          `<div class="dp ${kind}" style="grid-column:span ${span}">${label} <span style="opacity:.65">${span}개</span></div>`).join("")}
        ${sideRow("B",blueCode,"b")}
        ${sideRow("R",redCode,"r")}
      </div></div>

      <div class="focus-box">
        <div>
          <div style="font-size:10.5px;font-weight:800;color:var(--ink-3);letter-spacing:.03em;margin-bottom:7px">우선 밴 (1~4번)</div>
          <div class="focus-champs">${firstBans.map((c,i)=>miniTile(c,{ban:true,ord:i+1})).join("")}</div>
        </div>
        <div class="focus-txt">${bp.banFocus||""}</div>
      </div>

      <div class="bp-summary">
        ${[[blueKey,blueCode,"청팀"],[redKey,redCode,"홍팀"]].map(([k,code,lbl])=>`
        <div class="bp-col">
          <h5>${esc(T(code).name)} <span style="opacity:.7">· ${lbl}</span></h5>
          <div class="bp-line"><span class="bp-lb">픽</span>
            ${bp[k].picks.map(([c,p])=>miniTile(c,{pos:p,key:c===bp.key})).join("")}</div>
          <div class="bp-line"><span class="bp-lb">밴</span>
            ${bp[k].bans.map(c=>miniTile(c,{ban:true})).join("")}</div>
        </div>`).join("")}
      </div>

      <div class="sep"></div>
      <p style="font-size:13.5px;line-height:1.75;color:var(--ink-2);margin:0">${bp.note}</p>
    </div>
  </section>`;
}

/* ============================================================
   GOLD DIFFERENTIAL CHART
   ============================================================ */
function drawGoldChart(wrap, R, m){
  const W=900, H=280, PAD={t:18,r:22,b:34,l:52};
  const data = R.gold;
  const xs = data.map(d=>d[0]), ys = data.map(d=>d[1]);
  const xMax = Math.max(...xs);
  /* 0을 고정한 단일 선형 스케일 — 위/아래 여백만 잘라낸다 (px당 골드는 동일) */
  const hi = Math.max(0, ...ys), lo = Math.min(0, ...ys);
  const step = (hi-lo) > 10000 ? 4000 : 2000;
  let yMax = hi>0 ? Math.ceil(hi/step)*step : 0;
  let yMin = lo<0 ? Math.floor(lo/step)*step : 0;
  if(yMax===yMin) yMax = step;

  const X = v => PAD.l + (v/xMax)*(W-PAD.l-PAD.r);
  const Y = v => PAD.t + (1-(v-yMin)/(yMax-yMin))*(H-PAD.t-PAD.b);

  const linePts = data.map(d=>`${X(d[0]).toFixed(1)},${Y(d[1]).toFixed(1)}`).join(" ");
  const areaPts = `${X(0)},${Y(0)} ${linePts} ${X(xMax)},${Y(0)}`;

  const yTicks=[]; for(let v=yMin; v<=yMax; v+=step) yTicks.push(v);
  const xTicks=[]; for(let v=0; v<=xMax; v+=5) xTicks.push(v);

  const zeroY = Y(0);
  const fmtG = v => (v>0?"+":"") + (Math.abs(v)>=1000 ? (v/1000).toFixed(1)+"k" : v);

  /* 최대 우세 지점만 직접 라벨 */
  const peakA = data.reduce((a,b)=>b[1]>a[1]?b:a);
  const peakB = data.reduce((a,b)=>b[1]<a[1]?b:a);

  wrap.innerHTML = `
  <svg class="chart" viewBox="0 0 ${W} ${H}" role="img"
       aria-label="${esc(T(m.a).name)} 기준 분당 골드 격차 추이">
    <defs>
      <clipPath id="clipPos"><rect x="0" y="0" width="${W}" height="${zeroY}"/></clipPath>
      <clipPath id="clipNeg"><rect x="0" y="${zeroY}" width="${W}" height="${H-zeroY}"/></clipPath>
    </defs>

    ${yTicks.map(v=>`<line class="gridline" x1="${PAD.l}" x2="${W-PAD.r}" y1="${Y(v)}" y2="${Y(v)}"/>`).join("")}
    ${yTicks.map(v=>`<text class="tick" x="${PAD.l-10}" y="${Y(v)+3.5}" text-anchor="end">${fmtG(v)}</text>`).join("")}
    ${xTicks.map(v=>`<text class="tick" x="${X(v)}" y="${H-PAD.b+18}" text-anchor="middle">${v}분</text>`).join("")}

    <polygon points="${areaPts}" fill="var(--series-1)" opacity=".10" clip-path="url(#clipPos)"/>
    <polygon points="${areaPts}" fill="var(--series-2)" opacity=".10" clip-path="url(#clipNeg)"/>
    <line class="zeroline" x1="${PAD.l}" x2="${W-PAD.r}" y1="${zeroY}" y2="${zeroY}"/>

    <polyline points="${linePts}" fill="none" stroke="var(--series-1)" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round" clip-path="url(#clipPos)"/>
    <polyline points="${linePts}" fill="none" stroke="var(--series-2)" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round" clip-path="url(#clipNeg)"/>

    ${R.events.map(e=>{
      const p = data.find(d=>d[0]===e.m) || data.reduce((a,b)=>Math.abs(b[0]-e.m)<Math.abs(a[0]-e.m)?b:a);
      const col = e.side==="a" ? "var(--series-1)" : "var(--series-2)";
      return `<g><circle cx="${X(p[0])}" cy="${Y(p[1])}" r="6" fill="var(--surface-1)"/>
        <circle cx="${X(p[0])}" cy="${Y(p[1])}" r="4" fill="${col}"/></g>`;}).join("")}

    ${hi>500?`<g>
      <circle cx="${X(peakA[0])}" cy="${Y(peakA[1])}" r="6" fill="var(--surface-1)"/>
      <circle cx="${X(peakA[0])}" cy="${Y(peakA[1])}" r="4" fill="var(--series-1)"/>
      <text class="tick" x="${X(peakA[0])-9}" y="${Y(peakA[1])-9}" text-anchor="end"
        style="fill:var(--ink-1);font-weight:800">${fmtG(peakA[1])}</text></g>`:""}
    ${lo<-500?`<g>
      <circle cx="${X(peakB[0])}" cy="${Y(peakB[1])}" r="6" fill="var(--surface-1)"/>
      <circle cx="${X(peakB[0])}" cy="${Y(peakB[1])}" r="4" fill="var(--series-2)"/>
      <text class="tick" x="${X(peakB[0])}" y="${Y(peakB[1])+21}" text-anchor="middle"
        style="fill:var(--ink-1);font-weight:800">${fmtG(peakB[1])}</text></g>`:""}

    <line id="cross" x1="0" x2="0" y1="${PAD.t}" y2="${H-PAD.b}" stroke="var(--ink-3)"
      stroke-width="1" opacity="0"/>
    <rect id="hit" x="${PAD.l}" y="0" width="${W-PAD.l-PAD.r}" height="${H-PAD.b}" fill="transparent"/>
  </svg>
  <div class="tooltip" id="tt"></div>`;

  const svg=wrap.querySelector("svg"), hit=wrap.querySelector("#hit"),
        cross=wrap.querySelector("#cross"), tt=wrap.querySelector("#tt");

  function onMove(ev){
    const box = svg.getBoundingClientRect();
    const px = (ev.clientX - box.left) / box.width * W;
    const minute = Math.round((px-PAD.l)/(W-PAD.l-PAD.r)*xMax);
    const p = data.reduce((a,b)=>Math.abs(b[0]-minute)<Math.abs(a[0]-minute)?b:a);
    const evs = R.events.filter(e=>e.m===p[0]);
    const cx = X(p[0]);
    cross.setAttribute("x1",cx); cross.setAttribute("x2",cx); cross.setAttribute("opacity",".45");
    const lead = p[1]>=0 ? T(m.a).name : T(m.b).name;
    tt.innerHTML = `<b>${p[0]}분</b>
      <div class="tt-row" style="margin-top:4px"><span>${esc(lead)} 우세</span><span>${fmtG(Math.abs(p[1])).replace("+","")}</span></div>
      ${evs.map(e=>`<div class="tt-row"><span style="color:${e.side==='a'?'var(--series-1)':'var(--series-2)'}">●</span><span>${esc(e.label)}</span></div>`).join("")}`;
    tt.style.opacity=1;
    const left = cx/W*box.width;
    tt.style.left = Math.min(Math.max(left+12,0), box.width-tt.offsetWidth-4)+"px";
    tt.style.top  = (Y(p[1])/H*box.height - 10)+"px";
  }
  hit.addEventListener("mousemove",onMove);
  hit.addEventListener("touchmove",e=>{onMove(e.touches[0]);e.preventDefault();},{passive:false});
  hit.addEventListener("mouseleave",()=>{tt.style.opacity=0;cross.setAttribute("opacity",0);});
}

/* ============================================================
   BOOT
   ============================================================ */
$("#nav").addEventListener("click",e=>{
  const b=e.target.closest("button[data-view]"); if(b) go(b.dataset.view);
});
$("#themeBtn").addEventListener("click",()=>{
  const h=document.documentElement;
  h.dataset.theme = h.dataset.theme==="dark" ? "light" : "dark";
  if(state.view==="ai") render();
});
render();
</script>
